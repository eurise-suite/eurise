org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 (18 novembre 2026, ramo strumenti): per ora il Kotlin di JetBrains e il vecchio DSL, così i moduli non cambiano
# tutti insieme. Da togliere modulo per modulo prima di AGP 10 (docs/SICUREZZA.md, punto 2).
android.builtInKotlin=false
android.newDsl=false

# Impronte delle librerie (docs/SICUREZZA.md, punto 4): di base «lenient» (segnala, non ferma: gli indicatori dei plugin
# sono esclusi dalla verifica). Compila APK e CodeQL le rendono bloccanti con GRADLE_OPTS (-D...=strict).
org.gradle.dependency.verification=lenient
