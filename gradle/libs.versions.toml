[versions]
agp = "9.5.2"
kotlin = "2.3.20"
# Compose per il computer (desktop/app): la versione che va con Kotlin 2.1.0.
composeMultiplatform = "1.7.3"
ksp = "2.3.12"
composeBom = "2026.11.01"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
room = "2.8.5"
coroutines = "1.11.0"
junit = "4.13.2"
haze = "1.2.2"
healthConnect = "1.1.0-alpha10"
okhttp = "5.5.1"
work = "2.12.0"
camerax = "1.7.0"
media3 = "1.11.1"
pdfbox = "2.0.27.0"

[libraries]
# Office, PDF: annotazioni, pagine, moduli e cifratura scritti nel file (Apache 2.0, porting Android di Apache PDFBox).
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version = "20260814" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

androidx-credentials = { module = "androidx.credentials:credentials", version = "1.6.0" }
androidx-autofill = { module = "androidx.autofill:autofill", version = "1.3.0" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# Video della Fotocamera (Recorder, registrazione in MediaStore): già presente come dipendenza di camera-view.
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
# Elaborazioni del telefono (Notte, HDR) dove il produttore le offre: libreria aperta di AndroidX, il resto sta nel telefono.
androidx-camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camerax" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

# zxing: impronta senza chiave (verification-metadata, ignored-keys), 23 novembre 2026.
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
