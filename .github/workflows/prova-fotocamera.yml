name: Prova della Fotocamera sull'emulatore

# Porte e permessi della Fotocamera (docs/stato/FOTOCAMERA.md), prima del telefono: nessuna rete, solo le attività
# previste esportate, ogni ingresso si apre senza errori, «Scatta foto» rifiuta un indirizzo che punta ai nostri file,
# il fornitore delle copie condivise non si apre da fuori. Sul ramo di lavoro parte con il push (workflow_run e il lancio
# a mano valgono solo per i flussi del ramo principale).
on:
  push:
    branches: [prova-fotocamera]
    paths:
      - "camera/**"
      - "core/suite/**"
      - ".github/workflows/prova-fotocamera.yml"
      - ".github/scripts/prova-fotocamera-emulatore.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prova-fotocamera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compila la Fotocamera
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :camera:assembleDebug
          cp "$(find camera/build/outputs/apk/debug -name '*.apk' | head -1)" fotocamera.apk

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e prova
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash .github/scripts/prova-fotocamera-emulatore.sh

      - name: Schermate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prova-fotocamera-schermate-${{ github.run_number }}
          path: schermate/
          if-no-files-found: ignore
