name: Voci di Alfred

# Prepara le voci neurali che Eurise Voce scarica a richiesta (voice/…/speech/Voices.kt) e le mette nella pre-release
# «voci». Parte dagli archivi pubblicati da sherpa-onnx (voci Piper, licenza MIT; dati di pronuncia di espeak-ng, GPL 3)
# e tiene solo ciò che serve all'italiano, così il download scende da ~19 MB di dati a ~1 MB. Formato zip, che Android
# apre senza librerie in più. Parte quando cambia questo file o a mano.
on:
  push:
    paths:
      - ".github/workflows/voci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voci:
    runs-on: ubuntu-latest
    steps:
      - name: Prepara gli archivi
        run: |
          set -e
          mkdir out
          for pair in "alfred-riccardo:vits-piper-it_IT-riccardo-x_low" "alfred-paola:vits-piper-it_IT-paola-medium"; do
            id="${pair%%:*}"; src="${pair#*:}"
            curl -fsSL -o "$src.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$src.tar.bz2"
            tar xjf "$src.tar.bz2"
            cd "$src"
            # Dati di espeak-ng: tabelle comuni, voci e lingue, solo i dizionari italiano e inglese (nomi stranieri).
            find espeak-ng-data -maxdepth 1 -name '*_dict' ! -name it_dict ! -name en_dict -delete
            printf 'Voce Piper (licenza MIT) da rhasspy/piper-voices, convertita da sherpa-onnx.\nDati di pronuncia: espeak-ng (GPL 3), https://github.com/espeak-ng/espeak-ng\n' > LEGGIMI.txt
            zip -qr9 "../out/$id.zip" *.onnx tokens.txt espeak-ng-data MODEL_CARD LEGGIMI.txt
            cd ..
            ls -l "out/$id.zip"
          done

      - name: Kokoro (Nicola e Sara)
        run: |
          set -e
          # Kokoro-82M (Apache 2.0) convertito da sherpa-onnx, versione int8 a più lingue: un modello, più voci (Nicola 36,
          # Sara 35). Si tengono il modello, le voci, i simboli e i dati di espeak-ng per italiano e inglese; via i
          # dizionari e le regole del cinese e dell'inglese (l'italiano lo pronuncia espeak-ng).
          src=kokoro-int8-multi-lang-v1_0
          curl -fsSL -o "$src.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$src.tar.bz2"
          tar xjf "$src.tar.bz2"
          cd "$src"
          find espeak-ng-data -maxdepth 1 -name '*_dict' ! -name it_dict ! -name en_dict -delete
          printf 'Kokoro-82M (licenza Apache 2.0, hexgrad/Kokoro-82M), convertito da sherpa-onnx.\nVoci italiane: im_nicola (36), if_sara (35).\nDati di pronuncia: espeak-ng (GPL 3), https://github.com/espeak-ng/espeak-ng\n' > LEGGIMI.txt
          zip -qr9 ../out/alfred-kokoro.zip model.int8.onnx voices.bin tokens.txt espeak-ng-data LICENSE LEGGIMI.txt
          cd ..
          ls -l out/alfred-kokoro.zip

      - name: Supertonic 3 (le voci di Alfred scelte il 18 novembre)
        run: |
          set -e
          # Supertonic 3 (Supertone, pesi OpenRAIL-M) in int8, convertito da sherpa-onnx: 4 modelli, tts.json, indice dei
          # caratteri e stili delle 10 voci. L'italiano lo legge da sé, senza espeak-ng.
          src=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          curl -fsSL -o "$src.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$src.tar.bz2"
          tar xjf "$src.tar.bz2"
          ls -la "$src"
          for f in "$src"/*.md "$src"/*.txt "$src"/README*; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done || true
          pip install -q sherpa-onnx soundfile huggingface_hub numpy
          python3 - "$src" <<'PY'
          import sys, time, sherpa_onnx, soundfile as sf
          d = sys.argv[1]
          cfg = sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(
              supertonic=sherpa_onnx.OfflineTtsSupertonicModelConfig(
                  duration_predictor=f"{d}/duration_predictor.int8.onnx", text_encoder=f"{d}/text_encoder.int8.onnx",
                  vector_estimator=f"{d}/vector_estimator.int8.onnx", vocoder=f"{d}/vocoder.int8.onnx",
                  tts_json=f"{d}/tts.json", unicode_indexer=f"{d}/unicode_indexer.bin", voice_style=f"{d}/voice.bin"),
              num_threads=2))
          tts = sherpa_onnx.OfflineTts(cfg)
          print("voci:", tts.num_speakers, "frequenza:", tts.sample_rate)
          for sid in range(tts.num_speakers):
              gc = sherpa_onnx.GenerationConfig()
              gc.sid = sid
              gc.extra = {"lang": "it"}
              t = time.time()
              a = tts.generate("Buongiorno, sono Alfred. Chiamo Marco?", gc)
              print(f"sid {sid}: {len(a.samples)/a.sample_rate:.1f} s in {time.time()-t:.2f} s")
              sf.write(f"prova-{sid}.wav", a.samples, a.sample_rate)
          PY
          # Quale numero è M2 e quale M5: si cercano i numeri di ogni stile ufficiale (voice_styles/*.json di Supertone)
          # dentro voice.bin di sherpa-onnx; l'ordine in cui compaiono è il numero della voce.
          python3 - "$src" <<'PY'
          import sys, json, numpy as np
          from huggingface_hub import hf_hub_download
          d = sys.argv[1]
          raw = open(f"{d}/voice.bin", "rb").read()
          blob = np.frombuffer(raw[: len(raw) // 4 * 4], dtype=np.float32)
          where = {}
          for v in ["M1", "M2", "M3", "M4", "M5", "F1", "F2", "F3", "F4", "F5"]:
              st = json.load(open(hf_hub_download("Supertone/supertonic-3", f"voice_styles/{v}.json")))
              key = next(k for k in st if "ttl" in k.lower())
              x = np.asarray(st[key]["data"] if isinstance(st[key], dict) else st[key], dtype=np.float32).reshape(-1)[:8]
              hits = [i for i in range(len(blob) - 8) if np.allclose(blob[i:i + 8], x, atol=1e-6)][:3]
              where[v] = hits
              print("STILE", v, key, hits)
          order = sorted((h[0], v) for v, h in where.items() if h)
          for sid, (_, v) in enumerate(order):
              print(f"MAPPA sid {sid} = {v}")
          PY
          printf 'Supertonic 3 (Supertone Inc., pesi con licenza BigScience OpenRAIL-M: vedi LICENSE, limiti d uso inclusi),\nquantizzato int8 da sherpa-onnx (Apache 2.0). Voci di Alfred: M2 e M5.\n' > "$src/LEGGIMI.txt"
          (cd "$src" && zip -qr9 ../out/alfred-supertonic.zip *.int8.onnx tts.json unicode_indexer.bin voice.bin LICENSE LEGGIMI.txt)
          ls -l out/alfred-supertonic.zip

      - name: Pubblica nella pre-release «voci»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voci -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create voci -R "${{ github.repository }}" --prerelease --title "Voci di Alfred" \
              --notes "Voci neurali per Eurise Voce, scaricate a richiesta dall'app. Piper (MIT) e Kokoro (Apache 2.0) con i dati di espeak-ng (GPL 3)."
          gh release upload voci out/*.zip --clobber -R "${{ github.repository }}"
          echo "### Voci pubblicate" >> "$GITHUB_STEP_SUMMARY"
          ls -l out >> "$GITHUB_STEP_SUMMARY"
