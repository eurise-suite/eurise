name: Prova del backup

# Prova vera del backup (area Backup, 21 novembre 2026; docs/stato/BACKUP.md). Sull'emulatore, con le app dell'ultimo
# giro riuscito di Compila APK sul ramo prova-backup: backup cifrato, dati cancellati e Tastiera tolta, ripristino,
# Tastiera di nuovo. Una sonda (instrumentation con la chiave di prova delle app) usa il codice vero del backup.
# Il lancio a mano e workflow_run valgono solo per i flussi del ramo principale: sul ramo di lavoro parte con il push.
on:
  push:
    branches: [prova-backup]
    paths:
      - .github/workflows/prova-backup.yml
      - .github/prova-backup/**
      - .github/scripts/prova-backup-emulatore.sh
      - .github/prova-backup-giro
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id del giro di Compila APK (vuoto = ultimo riuscito su prova-backup)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trova il giro
        id: giro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.inputs.run_id }}"
          [ -z "$id" ] && [ -s .github/prova-backup-giro ] && id=$(tr -dc 0-9 < .github/prova-backup-giro)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=prova-backup&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "Giro di Compila APK: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.giro.outputs.id }}
          github-token: ${{ github.token }}
          path: artefatti
          pattern: "eurise-{debug,tastiera-debug}-*"

      - name: APK e sonda
        run: |
          set -e
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          mkdir -p apk classi
          for f in $(find artefatti -name '*.apk'); do
            pkg=$("$bt/aapt2" dump packagename "$f" 2>/dev/null || true)
            case "$pkg" in eu.eurise.hub.debug|eu.eurise.keyboard.debug) cp "$f" "apk/$pkg.apk";; esac
          done
          ls -la apk
          test -f apk/eu.eurise.hub.debug.apk && test -f apk/eu.eurise.keyboard.debug.apk
          javac -source 11 -target 11 -cp "$jar" -d classi .github/prova-backup/sonda/src/eu/eurise/prova/backup/Sonda.java
          "$bt/d8" --min-api 26 --lib "$jar" --output classi $(find classi -name '*.class')
          "$bt/aapt2" link -o sonda-grezza.apk --manifest .github/prova-backup/sonda/AndroidManifest.xml -I "$jar" --min-sdk-version 26 --target-sdk-version 34
          (cd classi && zip -q ../sonda-grezza.apk classes.dex)
          "$bt/zipalign" -f 4 sonda-grezza.apk sonda.apk
          # La sonda gira dentro Eurise: stessa chiave delle app di Compila APK (la chiave di prova vecchia).
          "$bt/apksigner" sign --ks app/debug-key/eurise-debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android sonda.apk

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e prova
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/prova-backup-emulatore.sh
