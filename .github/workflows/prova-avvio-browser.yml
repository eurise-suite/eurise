name: Prova dell'avvio del Browser sull'emulatore

# Il Browser compilato come l'APK di prova (R8, non debuggable), con il motore x86_64, avviato su un emulatore:
# primo avvio, una pagina, chiusura forzata e riapertura (schede riaperte). Il registro mostra l'errore se si chiude.
on:
  push:
    branches: [prova-avvio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avvio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EURISE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compila il Browser per x86_64
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :browser:assembleDebug -Peurise.geckoAbi=x86_64 > build.log 2>&1 || { grep -E "^ERROR|Missing class|R8" build.log | head -40; cat browser/build/outputs/mapping/debug/missing_rules.txt 2>/dev/null | head -60; tail -20 build.log; exit 1; }
          ls -la browser/build/outputs/apk/debug/

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Avvio sull'emulatore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/prova-avvio-browser.sh

      - name: Profilo d'uso raccolto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profilo-browser
          path: profilo/
          if-no-files-found: ignore
