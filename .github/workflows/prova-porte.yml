name: Prova delle porte d'ingresso

# Revisione delle porte d'ingresso (18 novembre 2026, docs/SICUREZZA.md). Sull'emulatore, due volte:
# - «prima»: le stesse app dall'ultimo giro riuscito di Compila APK su brand (senza le correzioni);
# - «dopo»: le stesse app compilate dal ramo (giro di Compila APK sul ramo prova-sicurezza, o quello indicato).
# Ogni volta un'app «curiosa» (permesso della suite dichiarato da sé, chiave sua) bussa ai fornitori di dati e al Ponte;
# un'app «amica» (stessa chiave delle app, permesso della suite vero) controlla che la suite parli ancora con sé stessa.
on:
  # Il lancio a mano e workflow_run valgono solo per i flussi del ramo principale: sul ramo di lavoro parte con il push.
  push:
    branches: [prova-sicurezza]
  workflow_run:
    workflows: ["Compila APK"]
    types: [completed]
    branches: [prova-sicurezza]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id del giro di Compila APK con le app «dopo» (vuoto = ultimo riuscito su prova-sicurezza)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  prova:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trova il giro
        id: giro
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          id="$RUN_ID"
          [ -z "$id" ] && id="${{ github.event.workflow_run.id }}"
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=prova-sicurezza&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          prima=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=brand&status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "prima=$prima" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.giro.outputs.id }}
          github-token: ${{ github.token }}
          path: artefatti
          pattern: "eurise-{debug,password-debug,messaggi-debug,tastiera-debug,postazione-debug,telefono-debug}-*"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.giro.outputs.prima }}
          github-token: ${{ github.token }}
          path: scaricati
          pattern: "eurise-{debug,password-debug,messaggi-debug,tastiera-debug,postazione-debug,telefono-debug}-*"

      - name: APK «prima», «dopo» e le due app di prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          mkdir -p scaricati prima dopo
          # Si riconosce ogni APK dal pacchetto, non dal nome del file.
          scegli() { # cartella sorgente, cartella destinazione
            for f in $(find "$1" -name '*.apk'); do
              pkg=$("$bt/aapt2" dump packagename "$f" 2>/dev/null || true)
              case "$pkg" in
                eu.eurise.hub.debug|eu.eurise.password.debug|eu.eurise.messages.debug|eu.eurise.keyboard.debug|eu.eurise.postazione.debug|eu.eurise.phone.debug|eu.eurise.mail.debug) cp "$f" "$2/$pkg.apk";;
              esac
            done
            ls -la "$2"
          }
          scegli scaricati prima
          scegli artefatti dopo

          # Le due app di prova: lo stesso codice, due manifesti.
          mkdir -p classi
          javac -source 11 -target 11 -cp "$jar" -d classi .github/prova-porte/intrusa/src/org/esempio/curiosa/Prova.java
          "$bt/d8" --min-api 26 --lib "$jar" --output classi $(find classi -name '*.class')
          costruisci() { # manifesto, nome
            "$bt/aapt2" link -o "$2-grezza.apk" --manifest "$1" -I "$jar" --min-sdk-version 26 --target-sdk-version 34
            (cd classi && zip -q "../$2-grezza.apk" classes.dex)
            "$bt/zipalign" -f 4 "$2-grezza.apk" "$2.apk"
          }
          costruisci .github/prova-porte/intrusa/AndroidManifest.xml curiosa
          sed -e 's/org.esempio.curiosa/org.esempio.amica/' \
              -e '/<permission /d' \
              -e 's/eu.eurise.permission.SUITE"/eu.eurise.permission.SUITE_DEBUG"/' \
              .github/prova-porte/intrusa/AndroidManifest.xml > amica.xml
          # Il codice resta nel pacchetto org.esempio.curiosa: nel manifesto dell'amica l'attività ha il nome intero.
          sed -i 's/android:name=".Prova"/android:name="org.esempio.curiosa.Prova"/' amica.xml
          costruisci amica.xml amica
          # La curiosa ha una chiave sua; l'amica la chiave delle app «dopo» (quella di prova vecchia, come i giri di Compila).
          keytool -genkeypair -keystore curiosa.p12 -storetype PKCS12 -storepass curiosa -keypass curiosa -alias curiosa \
            -keyalg EC -groupname secp256r1 -validity 365 -dname "CN=Curiosa" 2>/dev/null
          "$bt/apksigner" sign --ks curiosa.p12 --ks-pass pass:curiosa --ks-key-alias curiosa curiosa.apk
          "$bt/apksigner" sign --ks app/debug-key/eurise-debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android amica.apk

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e prova
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/prova-porte-emulatore.sh
