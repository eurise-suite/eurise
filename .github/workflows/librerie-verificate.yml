name: Librerie verificate (impronte)

# Piano di sicurezza, punto 4 (docs/SICUREZZA.md): Gradle controlla l'impronta SHA-256 di ogni libreria e plugin
# scaricati (gradle/verification-metadata.xml e keyboard/gradle/verification-metadata.xml). Questo flusso, lanciato a
# mano, compila tutto ciò che compila Compila APK scrivendo le impronte e le spinge sul ramo da cui parte.
# Finché gradle.properties dice «lenient», una libreria senza impronta o diversa si segnala senza fermare la compilazione;
# a file completo si passa a «strict» (una libreria manomessa ferma tutto).
on:
  workflow_dispatch:
  # Il lancio a mano vale solo per i flussi del ramo principale (main): sul ramo di lavoro parte quando cambia questo file.
  push:
    branches: [prova-sicurezza]
    paths: [".github/workflows/librerie-verificate.yml"]

permissions:
  contents: write

jobs:
  impronte:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Impronte della suite
        run: |
          chmod +x gradlew
          # Gli stessi comandi di Compila APK (lavoro «debug»); il computer entra in Gradle solo con EURISE_DESKTOP=1.
          # Il secondo giro aggiunge le sue impronte allo stesso file.
          ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleDebug testDebugUnitTest :core:ponte:test :desktop:ponte:installDist
          EURISE_DESKTOP=1 ./gradlew --no-daemon --write-verification-metadata sha256 \
            :core:sync:test :core:ponte:test :desktop:app:test :desktop:app:createDistributable
      - name: Impronte della Tastiera
        working-directory: keyboard
        run: |
          chmod +x gradlew 2>/dev/null || true
          g=./gradlew; [ -x "$g" ] || g=../gradlew
          $g --no-daemon --write-verification-metadata sha256 assembleDebug testDebugUnitTest --tests 'eu.eurise.*'
      - name: Spingi le impronte
        run: |
          git config user.name "eurise-impronte"
          git config user.email "eurise-impronte@users.noreply.github.com"
          git add gradle/verification-metadata.xml keyboard/gradle/verification-metadata.xml
          git diff --cached --quiet && { echo "Impronte già aggiornate"; exit 0; }
          git commit -m "[skip ci] Impronte delle librerie (verification-metadata.xml)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
