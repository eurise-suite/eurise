name: Librerie verificate (impronte)

# Piano di sicurezza, punto 4 (docs/SICUREZZA.md). Gradle verifica ogni libreria e plugin scaricati: con la firma PGP
# dell'autore quando c'è (GeckoView firmato da Mozilla, AndroidX da Google…; chiavi in gradle/verification-keyring.keys),
# altrimenti con l'impronta SHA-256 (gradle/verification-metadata.xml, e i file uguali della Tastiera). Questo flusso
# compila tutto ciò che compila Compila APK scrivendo firme e impronte, le prova a cache vuota e le spinge sul ramo.
# Bloccanti su prova-sicurezza (Compila e CodeQL), segnalate su brand.
on:
  workflow_dispatch:
  # Il lancio a mano vale solo per i flussi del ramo principale (main): sul ramo di lavoro parte quando cambia questo file.
  # Anche su brand: quando un'altra chat aggiunge o aggiorna una libreria, le impronte si riscrivono da sole.
  push:
    branches: [brand, prova-sicurezza]
    paths:
      - ".github/workflows/librerie-verificate.yml"
      - "gradle/libs.versions.toml"
      - "build.gradle.kts"
      - "**/build.gradle.kts"
      - "keyboard/gradle/*.toml"

permissions:
  contents: write
  actions: write

concurrency:
  group: impronte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impronte:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Spazio sul disco (Leggi, AI e Browser insieme)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1
      - name: Impronte della suite
        run: |
          chmod +x gradlew
          # Gli stessi comandi di tutti i lavori di Compila APK: Leggi, AI e Browser entrano in Gradle solo con le loro
          # variabili (prima mancavano: GeckoView e le librerie di Leggi e AI non avevano impronte). Ogni giro aggiunge
          # le sue impronte allo stesso file.
          export EURISE_READ=1 EURISE_AI=1 EURISE_BROWSER=1
          ./gradlew --no-daemon --write-verification-metadata pgp,sha256 --export-keys \
            assembleDebug testDebugUnitTest :read:assembleRelease :ai:assembleRelease \
            :core:ponte:test :desktop:ponte:installDist
          # La prova d'avvio del Browser sull'emulatore usa GeckoView per x86_64.
          ./gradlew --no-daemon --write-verification-metadata pgp,sha256 --export-keys :browser:assembleDebug -Peurise.geckoAbi=x86_64
          EURISE_DESKTOP=1 ./gradlew --no-daemon --write-verification-metadata pgp,sha256 --export-keys \
            :core:sync:test :core:ponte:test :desktop:app:test :desktop:app:createDistributable
          # GeckoView cambia versione da sé: la chiave di Mozilla vale per tutte le versioni, non solo per quella di oggi.
          python3 .github/scripts/fidati_mozilla.py gradle/verification-metadata.xml
      - name: GeckoView è firmato da Mozilla?
        run: |
          v=$(grep -o 'name="geckoview-arm64-v8a" version="[^"]*"' gradle/verification-metadata.xml | head -1 | sed 's/.*version="//; s/"//')
          echo "GeckoView $v"
          for ext in aar.asc pom.asc; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$v/geckoview-arm64-v8a-$v.$ext")
            echo "firma .$ext: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Impronte della Tastiera
        working-directory: keyboard
        run: |
          chmod +x gradlew 2>/dev/null || true
          g=./gradlew; [ -x "$g" ] || g=../gradlew
          $g --no-daemon --write-verification-metadata pgp,sha256 --export-keys assembleDebug testDebugUnitTest --tests 'eu.eurise.*'
          # Alcuni file (junit-bom .module) si chiedono solo riscaricando: un giro in più, che li aggiunge.
          $g --no-daemon --write-verification-metadata pgp,sha256 --export-keys --refresh-dependencies help assembleDebug --dry-run
      - name: Librerie che arrivano sul telefono (per OSV-Scanner)
        run: |
          set -e
          raccogli() { # cartella del progetto Gradle, file di uscita, comando gradlew, variabili
            dir=$1; out=$2; shift 2
            (cd "$dir" && env "$@" --no-daemon --no-configuration-cache -I "$GITHUB_WORKSPACE/gradle/eurise/librerie-esecuzione.gradle" euriseLibrerieEsecuzione -q)
            mkdir -p "$(dirname "$out")"
            { echo "# Librerie di esecuzione di tutte le app (generato da librerie-verificate.yml; non lo legge Gradle)."
              cat "$dir"/build/librerie-esecuzione/*.txt | sort -u
              echo "empty="; } > "$out"
            echo "$out: $(grep -c ':' "$out") librerie"
          }
          EURISE_READ=1 EURISE_AI=1 EURISE_BROWSER=1 raccogli . gradle/eurise/esecuzione/gradle.lockfile ./gradlew
          rm -rf build/librerie-esecuzione
          EURISE_DESKTOP=1 ./gradlew --no-daemon --no-configuration-cache -I gradle/eurise/librerie-esecuzione.gradle euriseLibrerieEsecuzione -q
          { cat gradle/eurise/esecuzione/gradle.lockfile | grep -v '^empty=' ; cat build/librerie-esecuzione/*.txt; } | grep -v '^#' | sort -u > /tmp/tutte
          { echo "# Librerie di esecuzione di tutte le app e del computer (generato da librerie-verificate.yml; non lo legge Gradle)."
            cat /tmp/tutte; echo "empty="; } > gradle/eurise/esecuzione/gradle.lockfile
          raccogli keyboard keyboard/gradle/eurise/esecuzione/gradle.lockfile ./gradlew

      - name: Impronte dei file chiesti solo in verifica
        run: |
          # Gradle a volte non scrive l'impronta di un file che poi chiede verificando: si prova in strict, si
          # aggiungono quelli segnalati (scaricati da Maven Central) e si riprova, fino a due volte.
          rm -rf ~/.gradle/caches/modules-2
          completa() { # cartella, file delle impronte, variabili
            dir=$1; meta=$2; shift 2
            for giro in 1 2; do
              (cd "$dir" && env "$@" ./gradlew --no-daemon --dependency-verification strict --refresh-dependencies help -q > /tmp/v.log 2>&1) && break
              python3 -I .github/scripts/impronte_mancanti.py "$meta" /tmp/v.log
            done
          }
          completa . gradle/verification-metadata.xml EURISE_READ=1 EURISE_AI=1 EURISE_BROWSER=1
          completa . gradle/verification-metadata.xml EURISE_DESKTOP=1
          completa keyboard keyboard/gradle/verification-metadata.xml X=1

      - name: Prova la verifica bloccante con la cache vuota
        # Ciò che serve per passare a «strict»: con la cache vuota (come un lavoro di Compila nuovo) e le librerie
        # riscaricate, ogni configurazione dei progetti (plugin compresi) deve passare. Non ferma il flusso: riferisce.
        continue-on-error: true
        run: |
          rm -rf ~/.gradle/caches/modules-2
          esito=0
          prova() { # nome, cartella, variabili d'ambiente
            nome=$1; dir=$2; shift 2
            if (cd "$dir" && env "$@" ./gradlew --no-daemon --dependency-verification strict --refresh-dependencies help -q > /tmp/strict.log 2>&1); then
              echo "OK  $nome" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "NO  $nome" | tee -a "$GITHUB_STEP_SUMMARY"
              grep -E "failed verification|artifacts? failed|Dependency verification failed" /tmp/strict.log | head -10 | tee -a "$GITHUB_STEP_SUMMARY"
              esito=1
            fi
          }
          prova "suite" . EURISE_READ=1 EURISE_AI=1 EURISE_BROWSER=1
          prova "computer" . EURISE_DESKTOP=1
          prova "Tastiera" keyboard X=1
          exit $esito

      - name: Spingi le impronte
        id: spingi
        run: |
          git config user.name "eurise-impronte"
          git config user.email "eurise-impronte@users.noreply.github.com"
          git add gradle/verification-metadata.xml keyboard/gradle/verification-metadata.xml \
            gradle/verification-keyring.keys keyboard/gradle/verification-keyring.keys \
            gradle/eurise/esecuzione/gradle.lockfile keyboard/gradle/eurise/esecuzione/gradle.lockfile
          git diff --cached --quiet && { echo "Impronte già aggiornate"; exit 0; }
          git commit -m "Impronte delle librerie (verification-metadata.xml e librerie di esecuzione)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "spinto=1" >> "$GITHUB_OUTPUT"
      - name: Rilancia Compila APK con le impronte nuove
        # Un push fatto da un flusso non avvia altri flussi (regola di GitHub): lo si lancia qui.
        if: steps.spingi.outputs.spinto == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${GITHUB_REF_NAME}" -R "${{ github.repository }}"
