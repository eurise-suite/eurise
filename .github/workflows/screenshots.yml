name: Schermate per F-Droid

# Telefono simulato con dati di esempio: scatta le schermate in Perla e in Notte.
# Parte a mano (Actions → Schermate per F-Droid) o quando cambiano i file che le producono.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/screenshots.yml"
      - "scripts/screenshots/**"
      - "app/src/debug/**"
      - "postazione/src/main/**"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schermate:
    name: Schermate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compila l'APK di prova
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :postazione:assembleDebug

      # L'emulatore ha bisogno della virtualizzazione (KVM) della macchina di GitHub.
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Scatta le schermate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Europe/Rome
          script: bash scripts/screenshots/take.sh "$(ls app/build/outputs/apk/debug/*.apk | head -1)" build/screenshots "$(ls postazione/build/outputs/apk/debug/*.apk | head -1)"

      - name: Carica le schermate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eurise-schermate-${{ github.run_number }}
          path: build/screenshots
          if-no-files-found: warn

      # Le immagini vanno anche nel ramo «schermate» (solo loro, sovrascritto a ogni giro): si guardano prima di
      # copiarle in fastlane/metadata/android/*/images/phoneScreenshots.
      - name: Pubblica nel ramo schermate
        if: success()
        run: |
          cd build/screenshots
          git init -q -b schermate
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Schermate dal telefono simulato (${GITHUB_SHA::7}) [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" schermate
