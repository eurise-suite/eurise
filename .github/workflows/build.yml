name: Compila APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: APK di prova
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila e prova
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest :core:ponte:test :desktop:ponte:installDist 2>&1 | tee build.log

      # Gli errori di compilazione diventano annotazioni, leggibili anche senza scaricare il registro.
      - name: Riassunto degli errori
        if: failure()
        run: |
          grep -E "^e: |Could not (resolve|find)|error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # Anche le righe che seguono "What went wrong" (per esempio i controlli sulle librerie).
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: eurise-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Eurise Office (leggero: schermata iniziale, vista rapida, PDF; il motore è l'APK compagno di office-app.yml).
      - name: Prepara l'APK di Office
        run: |
          mkdir -p office-apk
          cp office/apk/build/outputs/apk/debug/*.apk office-apk/eurise-office-debug.apk

      - name: Carica l'APK di Office
        uses: actions/upload-artifact@v4
        with:
          name: eurise-office-debug-${{ github.run_number }}
          path: office-apk/eurise-office-debug.apk
          if-no-files-found: error

      - name: Carica il Ponte per il computer (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: eurise-ponte-linux-${{ github.run_number }}
          path: desktop/ponte/build/install/eurise-ponte/
          if-no-files-found: error

      - name: Carica l'APK della Galleria
        uses: actions/upload-artifact@v4
        with:
          name: eurise-galleria-debug-${{ github.run_number }}
          path: gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Voce
        uses: actions/upload-artifact@v4
        with:
          name: eurise-voce-debug-${{ github.run_number }}
          path: voice/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Telefono
        uses: actions/upload-artifact@v4
        with:
          name: eurise-telefono-debug-${{ github.run_number }}
          path: phone/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Messaggi
        uses: actions/upload-artifact@v4
        with:
          name: eurise-messaggi-debug-${{ github.run_number }}
          path: messages/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Email
        uses: actions/upload-artifact@v4
        with:
          name: eurise-email-debug-${{ github.run_number }}
          path: mail/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Chat
        uses: actions/upload-artifact@v4
        with:
          name: eurise-chat-debug-${{ github.run_number }}
          path: chat/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Password
        uses: actions/upload-artifact@v4
        with:
          name: eurise-password-debug-${{ github.run_number }}
          path: password/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Il file scritto dai test (dati finti) deve aprirsi con un programma che non è il nostro.
      - name: Verifica il file KeePass con un altro programma
        run: |
          # Se la compilazione ha ripreso i test dalla cache, il file non è stato riscritto: niente da controllare.
          [ -f password/build/interop/eurise.kdbx ] || exit 0
          pip install --quiet pykeepass==4.2.0
          python3 - <<'PY'
          from pykeepass import PyKeePass
          db = PyKeePass('password/build/interop/eurise.kdbx', password='prova-eurise')
          entry = db.entries[0]
          assert (entry.title, entry.username, entry.password, entry.url, entry.notes) == ('Sito', 'io', 'S3greta&<x>', 'https://sito.it', 'nota')
          assert entry.otp.startswith('otpauth://')
          print('Aperto da pykeepass:', db.version, db.kdf_algorithm, db.encryption_algorithm)
          PY

      # La cartella cifrata scritta dai test (dati finti) deve aprirsi con un altro programma.
      - name: Verifica la cartella cifrata con un altro programma
        run: |
          pip install --quiet pycryptomator==1.15
          python3 - <<'PY'
          import io
          from pycryptomator.cryptomator import Vault
          v = Vault('core/cloud/build/interop-vault', password='prova-eurise')
          def read(path):
              out = io.BytesIO()
              out.close = lambda: None
              v.decryptFile(path, out)
              return out.getvalue()
          assert read('/ciao.txt') == 'ciao da Eurise'.encode()
          assert read('/nota.md') == 'nome con riempimento'.encode()
          assert read('/' + 'a' * 200 + '.txt') == 'nome lungo'.encode()
          assert read('/sotto/dati.bin') == bytes(i % 251 for i in range(70000))
          print('Aperta da pycryptomator')
          PY

      # Leggerezza: si pesa a ogni compilazione anche la versione ufficiale (ridotta, non firmata).
      # L'APK di prova è già caricato: se questo passo fallisce, non blocca nulla.
      - name: Pesa la versione ufficiale
        continue-on-error: true
        run: |
          python3 .github/scripts/apk_size.py "APK di prova" app/build/outputs/apk/debug/*.apk
          ./gradlew --no-daemon assembleRelease 2>&1 | tail -20
          python3 .github/scripts/apk_size.py "Versione ufficiale" app/build/outputs/apk/release/*.apk 6


  tastiera:
    name: APK della Tastiera
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Eurise Tastiera è un progetto Gradle a sé (nasce da HeliBoard e ne segue le versioni degli strumenti).
      - name: Compila e prova la Tastiera
        working-directory: keyboard
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest --tests 'eu.eurise.*' 2>&1 | tee build.log

      - name: Riassunto degli errori
        if: failure()
        working-directory: keyboard
        run: |
          grep -E "^e: |Could not (resolve|find)|error:|FAILED" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Misura della scrittura scorrendo
        if: always()
        working-directory: keyboard
        run: |
          f=app/build/glide-report.txt
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" && while IFS= read -r line; do echo "::notice::${line}"; done < "$f" || true

      - name: Carica l'APK della Tastiera
        uses: actions/upload-artifact@v4
        with:
          name: eurise-tastiera-debug-${{ github.run_number }}
          path: keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Eurise Leggi (lettura del testo con Tesseract e Leptonica, traduzione con slimt, ruy e SentencePiece, tutti dai
  # sorgenti di third_party): APK, peso, qualità della lettura in italiano e della traduzione italiano ↔ inglese.
  # Lavoro a parte e facoltativo: se fallisce, gli altri APK restano buoni.
  read:
    name: Eurise Leggi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      EURISE_READ: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila Eurise Leggi
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :read:assembleDebug :read:assembleRelease 2>&1 | tee build.log | tail -30

      - name: Carica l'APK di Leggi
        uses: actions/upload-artifact@v4
        with:
          name: eurise-leggi-debug-${{ github.run_number }}
          path: read/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pesa Eurise Leggi
        run: |
          python3 .github/scripts/apk_size.py "Eurise Leggi, prova" read/build/outputs/apk/debug/*.apk
          python3 .github/scripts/apk_size.py "Eurise Leggi, versione ridotta" read/build/outputs/apk/release/*.apk

      - name: Misura la qualità in italiano
        run: |
          # Stesso motore dell'APK (stessi sorgenti e opzioni), compilato per il computer.
          cmake -S read/src/main/cpp -B ocr-host -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build ocr-host -j 4 > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          mkdir -p fast best
          curl -sSL -o fast/ita.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ita.traineddata
          curl -sSL -o best/ita.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/ita.traineddata
          pip install --quiet pillow
          EURISE_OCR="$PWD/ocr-host/eurise_ocr_test" python3 .github/scripts/ocr_quality.py fast best

      - name: Misura qualità e velocità della traduzione
        run: |
          test -x ocr-host/eurise_translate_test
          python3 .github/scripts/mt_quality.py ocr-host/eurise_translate_test mt-work

  # Eurise Browser su GeckoView (motore di Firefox, circa 50 MB per arm64): lavoro a parte, come Leggi e AI.
  browser:
    name: Eurise Browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      EURISE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila Eurise Browser e prova la logica
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :browser:assembleDebug :browser:testDebugUnitTest 2>&1 | tee build.log | tail -30
          grep -o "org.mozilla.geckoview:geckoview-arm64-v8a:[^ ]*" build.log | sort -u | head -3 || true

      - name: Riassunto degli errori
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do echo "::error::${line}"; done
          # R8 scrive i suoi errori in maiuscolo («ERROR: … Missing class …») e le regole mancanti in un file a parte.
          grep -E "^ERROR|R8: |Missing class" build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
          cat browser/build/outputs/mapping/debug/missing_rules.txt 2>/dev/null | head -40 | while IFS= read -r line; do echo "::error::R8 ${line}"; done

      - name: Versione di GeckoView usata
        run: |
          ./gradlew --no-daemon -q :browser:dependencies --configuration debugRuntimeClasspath 2>/dev/null | grep -m1 "geckoview" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Carica l'APK del Browser
        uses: actions/upload-artifact@v4
        with:
          name: eurise-browser-debug-${{ github.run_number }}
          path: browser/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pesa il Browser
        run: python3 .github/scripts/apk_size.py "Eurise Browser, prova" browser/build/outputs/apk/debug/*.apk

  # Eurise AI, prototipo (llama.cpp dai sorgenti di third_party): APK senza Internet, peso, e con Ministral 3 3B
  # (Apache 2.0, GGUF ufficiale di Mistral) comprensione della cattura rapida e velocità sul computer di compilazione.
  # Lavoro a parte e facoltativo: se fallisce, gli altri APK restano buoni.
  ai:
    name: Eurise AI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      EURISE_AI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila Eurise AI
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :ai:assembleDebug :ai:assembleRelease 2>&1 | tee build.log | tail -30

      - name: Riassunto degli errori
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Carica l'APK di Eurise AI
        uses: actions/upload-artifact@v4
        with:
          name: eurise-ai-debug-${{ github.run_number }}
          path: ai/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pesa Eurise AI e controlla che non abbia Internet
        run: |
          python3 .github/scripts/apk_size.py "Eurise AI, prova" ai/build/outputs/apk/debug/*.apk
          python3 .github/scripts/apk_size.py "Eurise AI, versione ridotta" ai/build/outputs/apk/release/*.apk
          { echo "Librerie native (versione ridotta):"; echo '```'; unzip -lv ai/build/outputs/apk/release/*.apk 'lib/*' | awk 'NR>3 {print $1, $3, $8}' | sort -n -r | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions ai/build/outputs/apk/release/*.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::Eurise AI ha il permesso INTERNET"; exit 1; fi

      - name: Compila il motore per il computer
        run: |
          cmake -S ai/src/main/cpp -B ai-host -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build ai-host -j 4 > /dev/null

      - name: Scegli il modello (GGUF ufficiale di Mistral, Q4_K_M)
        id: model
        run: |
          REPO=mistralai/Ministral-3-3B-Instruct-2512-GGUF
          NAME=$(curl -sSL "https://huggingface.co/api/models/$REPO" | python3 -c "
          import json, sys
          files = [s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].endswith('.gguf') and 'mmproj' not in s['rfilename'].lower()]
          pick = [f for f in files if 'Q4_K_M' in f] or [f for f in files if 'Q4' in f] or files
          print(pick[0])")
          echo "Modello: $REPO/$NAME"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ai-model
          key: ai-model-${{ steps.model.outputs.name }}

      - name: Misura comprensione e velocità
        run: |
          mkdir -p ai-model
          F="ai-model/${{ steps.model.outputs.name }}"
          [ -s "$F" ] || curl -sSL --retry 3 -o "$F" "https://huggingface.co/${{ steps.model.outputs.repo }}/resolve/main/${{ steps.model.outputs.name }}"
          ls -la ai-model
          python3 .github/scripts/ai_quality.py ai-host/eurise_ai_test "$F" ai/src/main/res/raw/frasi_prova.txt 4
          python3 .github/scripts/ai_commands.py ai-host/eurise_ai_test "$F" 4

      - name: Scegli il modello Rapido (Granite 4.0 1B di IBM, Apache 2.0, Q4_K_M)
        id: rapido
        continue-on-error: true
        run: |
          REPO=ibm-granite/granite-4.0-1b-GGUF
          NAME=$(curl -sSL "https://huggingface.co/api/models/$REPO" | python3 -c "
          import json, sys
          files = [s['rfilename'] for s in json.load(sys.stdin)['siblings'] if s['rfilename'].endswith('.gguf')]
          pick = [f for f in files if 'Q4_K_M' in f] or [f for f in files if 'Q4' in f] or files
          print(pick[0])")
          echo "Modello Rapido: $REPO/$NAME"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Rapido: https://huggingface.co/$REPO/resolve/main/$NAME" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        if: steps.rapido.outcome == 'success'
        with:
          path: ai-model-rapido
          key: ai-model-${{ steps.rapido.outputs.name }}

      - name: Comandi con il modello Rapido
        if: steps.rapido.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p ai-model-rapido
          F="ai-model-rapido/${{ steps.rapido.outputs.name }}"
          [ -s "$F" ] || curl -sSL --retry 3 -o "$F" "https://huggingface.co/${{ steps.rapido.outputs.repo }}/resolve/main/${{ steps.rapido.outputs.name }}"
          ls -la ai-model-rapido
          python3 .github/scripts/ai_commands.py ai-host/eurise_ai_test "$F" 4

  # Eurise per Firefox sul computer (desktop/firefox): controllo della sintassi e pacchetto da caricare in Firefox.
  # Non firmato: per l'installazione stabile serve la firma di Mozilla con l'account del proprietario.
  firefox:
    name: Eurise per Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Controlla e impacchetta l'estensione
        run: |
          cd desktop/firefox
          python3 -c "import json; json.load(open('manifest.json'))"
          for f in background.js content.js ui/*.js; do node --check "$f"; done
          npx --yes web-ext@8 lint --source-dir . --self-hosted || true
          zip -qr ../../eurise-firefox.xpi . -x README.md
      - uses: actions/upload-artifact@v4
        with:
          name: eurise-firefox-${{ github.run_number }}
          path: eurise-firefox.xpi
          if-no-files-found: error

  # Eurise per il computer (desktop/app, Compose Desktop) con il nucleo di sincronizzazione (core/sync): prove, programma
  # per Linux con il suo Java dentro, avvio provato su Ubuntu 24.04, Ubuntu 22.04 LTS e Fedora, poi il Flatpak.
  computer:
    name: Eurise per il computer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EURISE_DESKTOP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove del nucleo e programma
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :core:sync:test :core:ponte:test :desktop:app:test :desktop:app:createDistributable 2>&1 | tee desktop.log
      - name: Riassunto degli errori
        if: failure()
        run: |
          grep -E "^e: |Could not (resolve|find)|error:|FAILED|Test.*>.*FAILED" desktop.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          grep -A 12 "What went wrong" desktop.log | head -40 | grep -v "^\s*$" | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Prova d'avvio su Ubuntu e Fedora
        run: |
          app=desktop/app/build/compose/binaries/main/app/eurise
          ls -la "$app" "$app/bin"
          cat > /tmp/avvio.sh <<'SH'
          set -e
          export SKIKO_RENDER_API=SOFTWARE HOME=/tmp/casa
          mkdir -p $HOME
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 /app/bin/eurise > /tmp/eurise.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 $pid 2>/dev/null; then echo "avvio riuscito"; kill $pid; else echo "si è chiuso:"; cat /tmp/eurise.log; exit 1; fi
          grep -i "exception" /tmp/eurise.log && exit 1 || true
          /app/bin/eurise dispositivi
          SH
          for img in ubuntu:24.04 ubuntu:22.04; do
            echo "::group::$img"
            docker run --rm -v "$PWD/$app:/app:ro" -v /tmp/avvio.sh:/avvio.sh:ro "$img" sh -c \
              "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libxrender1 libxtst6 libxi6 libfontconfig1 fonts-dejavu-core libgl1 >/dev/null && sh /avvio.sh"
            echo "::endgroup::"
          done
          echo "::group::fedora:latest"
          docker run --rm -v "$PWD/$app:/app:ro" -v /tmp/avvio.sh:/avvio.sh:ro fedora:latest sh -c \
            "dnf install -y -q xorg-x11-server-Xvfb libXrender libXtst libXi fontconfig dejavu-sans-fonts mesa-libGL procps-ng >/dev/null && sh /avvio.sh"
          echo "::endgroup::"
      - name: Archivio per Linux
        run: tar -czf eurise-linux.tar.gz -C desktop/app/build/compose/binaries/main/app eurise
      - uses: actions/upload-artifact@v4
        with:
          name: eurise-linux-${{ github.run_number }}
          path: eurise-linux.tar.gz
          if-no-files-found: error

  flatpak:
    name: Flatpak di Eurise
    needs: computer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eurise-linux-${{ github.run_number }}
      - name: Programma nella cartella del Flatpak
        run: |
          mkdir -p desktop/flatpak/app
          tar -xzf eurise-linux.tar.gz -C /tmp
          cp -a /tmp/eurise/. desktop/flatpak/app/
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: eurise-linux.flatpak
          manifest-path: desktop/flatpak/eu.eurise.Eurise.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: eurise-flatpak-${{ github.run_number }}
          path: eurise-linux.flatpak
          if-no-files-found: error

  release:
    name: APK firmato (solo per i tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La chiave di firma sta solo nei "secrets" del repository, codificata in base64.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.EURISE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Manca il secret EURISE_KEYSTORE_BASE64: vedi il README." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eurise.jks"
          echo "EURISE_KEYSTORE_PATH=$RUNNER_TEMP/eurise.jks" >> "$GITHUB_ENV"

      - name: Compila la versione firmata
        env:
          EURISE_KEYSTORE_PASSWORD: ${{ secrets.EURISE_KEYSTORE_PASSWORD }}
          EURISE_KEY_ALIAS: ${{ secrets.EURISE_KEY_ALIAS }}
          EURISE_KEY_PASSWORD: ${{ secrets.EURISE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/eurise.jks"

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
