name: Compila APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: APK di prova
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila e prova
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Gli errori di compilazione diventano annotazioni, leggibili anche senza scaricare il registro.
      - name: Riassunto degli errori
        if: failure()
        run: |
          grep -E "^e: |Could not (resolve|find)|error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # Anche le righe che seguono "What went wrong" (per esempio i controlli sulle librerie).
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: eurise-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK della Galleria
        uses: actions/upload-artifact@v4
        with:
          name: eurise-galleria-debug-${{ github.run_number }}
          path: gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Voce
        uses: actions/upload-artifact@v4
        with:
          name: eurise-voce-debug-${{ github.run_number }}
          path: voice/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Carica l'APK di Password
        uses: actions/upload-artifact@v4
        with:
          name: eurise-password-debug-${{ github.run_number }}
          path: password/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Il file scritto dai test (dati finti) deve aprirsi con un programma che non è il nostro.
      - name: Verifica il file KeePass con un altro programma
        run: |
          # Se la compilazione ha ripreso i test dalla cache, il file non è stato riscritto: niente da controllare.
          [ -f password/build/interop/eurise.kdbx ] || exit 0
          pip install --quiet pykeepass==4.2.0
          python3 - <<'PY'
          from pykeepass import PyKeePass
          db = PyKeePass('password/build/interop/eurise.kdbx', password='prova-eurise')
          entry = db.entries[0]
          assert (entry.title, entry.username, entry.password, entry.url, entry.notes) == ('Sito', 'io', 'S3greta&<x>', 'https://sito.it', 'nota')
          assert entry.otp.startswith('otpauth://')
          print('Aperto da pykeepass:', db.version, db.kdf_algorithm, db.encryption_algorithm)
          PY

      # La cartella cifrata scritta dai test (dati finti) deve aprirsi con un altro programma.
      - name: Verifica la cartella cifrata con un altro programma
        run: |
          pip install --quiet pycryptomator==1.15
          python3 - <<'PY'
          import io
          from pycryptomator.cryptomator import Vault
          v = Vault('core/cloud/build/interop-vault', password='prova-eurise')
          def read(path):
              out = io.BytesIO()
              out.close = lambda: None
              v.decryptFile(path, out)
              return out.getvalue()
          assert read('/ciao.txt') == 'ciao da Eurise'.encode()
          assert read('/nota.md') == 'nome con riempimento'.encode()
          assert read('/' + 'a' * 200 + '.txt') == 'nome lungo'.encode()
          assert read('/sotto/dati.bin') == bytes(i % 251 for i in range(70000))
          print('Aperta da pycryptomator')
          PY

      # Leggerezza: si pesa a ogni compilazione anche la versione ufficiale (ridotta, non firmata).
      # L'APK di prova è già caricato: se questo passo fallisce, non blocca nulla.
      - name: Pesa la versione ufficiale
        continue-on-error: true
        run: |
          python3 .github/scripts/apk_size.py "APK di prova" app/build/outputs/apk/debug/*.apk
          ./gradlew --no-daemon assembleRelease 2>&1 | tail -20
          python3 .github/scripts/apk_size.py "Versione ufficiale" app/build/outputs/apk/release/*.apk 6


  tastiera:
    name: APK della Tastiera
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Eurise Tastiera è un progetto Gradle a sé (nasce da HeliBoard e ne segue le versioni degli strumenti).
      - name: Compila e prova la Tastiera
        working-directory: keyboard
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest --tests 'eu.eurise.*' 2>&1 | tee build.log

      - name: Riassunto degli errori
        if: failure()
        working-directory: keyboard
        run: |
          grep -E "^e: |Could not (resolve|find)|error:|FAILED" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A 12 "What went wrong" build.log | head -60 | grep -v "^\s*$" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Misura della scrittura scorrendo
        if: always()
        working-directory: keyboard
        run: |
          f=app/build/glide-report.txt
          [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" && while IFS= read -r line; do echo "::notice::${line}"; done < "$f" || true

      - name: Carica l'APK della Tastiera
        uses: actions/upload-artifact@v4
        with:
          name: eurise-tastiera-debug-${{ github.run_number }}
          path: keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Eurise Leggi (lettura del testo con Tesseract e Leptonica, traduzione con slimt, ruy e SentencePiece, tutti dai
  # sorgenti di third_party): APK, peso, qualità della lettura in italiano e della traduzione italiano ↔ inglese.
  # Lavoro a parte e facoltativo: se fallisce, gli altri APK restano buoni.
  read:
    name: Eurise Leggi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      EURISE_READ: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila Eurise Leggi
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :read:assembleDebug :read:assembleRelease 2>&1 | tee build.log | tail -30

      - name: Carica l'APK di Leggi
        uses: actions/upload-artifact@v4
        with:
          name: eurise-leggi-debug-${{ github.run_number }}
          path: read/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pesa Eurise Leggi
        run: |
          python3 .github/scripts/apk_size.py "Eurise Leggi, prova" read/build/outputs/apk/debug/*.apk
          python3 .github/scripts/apk_size.py "Eurise Leggi, versione ridotta" read/build/outputs/apk/release/*.apk

      - name: Misura la qualità in italiano
        run: |
          # Stesso motore dell'APK (stessi sorgenti e opzioni), compilato per il computer.
          cmake -S read/src/main/cpp -B ocr-host -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build ocr-host -j 4 > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          mkdir -p fast best
          curl -sSL -o fast/ita.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ita.traineddata
          curl -sSL -o best/ita.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/ita.traineddata
          pip install --quiet pillow
          EURISE_OCR="$PWD/ocr-host/eurise_ocr_test" python3 .github/scripts/ocr_quality.py fast best

      - name: Misura qualità e velocità della traduzione
        run: |
          test -x ocr-host/eurise_translate_test
          python3 .github/scripts/mt_quality.py ocr-host/eurise_translate_test mt-work

  release:
    name: APK firmato (solo per i tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La chiave di firma sta solo nei "secrets" del repository, codificata in base64.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.EURISE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Manca il secret EURISE_KEYSTORE_BASE64: vedi il README." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eurise.jks"
          echo "EURISE_KEYSTORE_PATH=$RUNNER_TEMP/eurise.jks" >> "$GITHUB_ENV"

      - name: Compila la versione firmata
        env:
          EURISE_KEYSTORE_PASSWORD: ${{ secrets.EURISE_KEYSTORE_PASSWORD }}
          EURISE_KEY_ALIAS: ${{ secrets.EURISE_KEY_ALIAS }}
          EURISE_KEY_PASSWORD: ${{ secrets.EURISE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/eurise.jks"

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
