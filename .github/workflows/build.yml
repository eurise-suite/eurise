name: Compila APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: APK di prova
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila e prova
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: eurise-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: APK firmato (solo per i tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La chiave di firma sta solo nei "secrets" del repository, codificata in base64.
      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.EURISE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Manca il secret EURISE_KEYSTORE_BASE64: vedi il README." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eurise.jks"
          echo "EURISE_KEYSTORE_PATH=$RUNNER_TEMP/eurise.jks" >> "$GITHUB_ENV"

      - name: Compila la versione firmata
        env:
          EURISE_KEYSTORE_PASSWORD: ${{ secrets.EURISE_KEYSTORE_PASSWORD }}
          EURISE_KEY_ALIAS: ${{ secrets.EURISE_KEY_ALIAS }}
          EURISE_KEY_PASSWORD: ${{ secrets.EURISE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/eurise.jks"

      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
