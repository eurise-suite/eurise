name: Prototipo di Eurise Mappe

# Punto 6 della road map, Mappe: compila CoMaps (Apache 2.0, comunitario, su F-Droid) per arm64 con il nome e il pacchetto
# di Eurise (eu.eurise.maps) e la chiave di debug della suite; misura tempo e peso. Vedi maps/EURISE.md.
# Parte a mano (Actions → Prototipo di Eurise Mappe → Run workflow) o quando cambiano i suoi file.
on:
  workflow_dispatch:
    inputs:
      variante:
        description: "Variante (docs/SICUREZZA.md, «Mappe»): prova parla con le app di prova, ufficiale con le ufficiali"
        type: choice
        options: [prova, ufficiale]
        default: prova
  push:
    paths:
      - ".github/workflows/maps-engine.yml"
      - ".github/scripts/apt-update.sh"
      - "maps/**"

permissions:
  contents: read

concurrency:
  group: maps-engine
  cancel-in-progress: false

env:
  COMAPS_REPO: https://codeberg.org/comaps/comaps.git
  # Commit fissato (11 novembre 2026). Per aggiornare CoMaps si cambia qui e si riprova.
  COMAPS_COMMIT: df67cc017b1755b456180c3db258d519e1788bb7
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
  # Sui push sempre «prova». La variante «ufficiale» produce eurise-mappe-ufficiale.apk, che apk-prova non pubblica mai.
  EURISE_VARIANTE: ${{ inputs.variante || 'prova' }}

jobs:
  mappe:
    name: Eurise Mappe (CoMaps, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prova i calcoli (km dalle pietre miliari, orari della scheda)
        run: |
          mkdir -p "$RUNNER_TEMP/prove"
          src=maps/android/app/src/main/java/app/organicmaps/eurise
          javac -d "$RUNNER_TEMP/prove" "$src/MilestoneKm.java" "$src/OpeningRows.java" "$src/NowPlayingText.java" "$src/GuideWit.java" maps/test/app/organicmaps/eurise/*.java
          java -cp "$RUNNER_TEMP/prove" app.organicmaps.eurise.MilestoneKmTest
          java -cp "$RUNNER_TEMP/prove" app.organicmaps.eurise.OpeningRowsTest
          java -cp "$RUNNER_TEMP/prove" app.organicmaps.eurise.NowPlayingTextTest
          java -cp "$RUNNER_TEMP/prove" app.organicmaps.eurise.GuideWitTest

      - name: Fa spazio sul disco
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/local/share/powershell || true
          df -h / | tail -1

      - name: Installa gli strumenti
        # Se i mirror non rispondono il passo si ferma qui, senza tenere occupata la coda per ore.
        timeout-minutes: 30
        run: |
          # Se il mirror di Azure non si risolve passa ad archive.ubuntu.com, poi a un DNS pubblico.
          bash .github/scripts/apt-update.sh
          # Come in docs/INSTALL.md di CoMaps: configure.sh compila gli strumenti per stili e simboli (Qt, glfw con X11).
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ninja-build ccache python3-venv python3-pip optipng jq curl \
            python-is-python3 libicu-dev libfreetype-dev libharfbuzz-dev zlib1g-dev qt6-base-dev qt6-declarative-dev \
            qt6-positioning-dev qt6-svg-dev libqt6svg6-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev >/dev/null
          pip install "protobuf<3.21" --break-system-packages -q
          mkdir -p "$HOME/.ccache" && ccache -M 3G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Scarica CoMaps (commit fissato, sottomoduli senza storia)
        run: |
          t0=$(date +%s)
          mkdir -p "$HOME/comaps" && cd "$HOME/comaps"
          git init -q && git remote add origin "$COMAPS_REPO"
          # Se codeberg.org non si risolve (18 novembre: due giri persi) riprova e poi aggiunge un DNS pubblico,
          # come apt-update.sh per i mirror di Ubuntu.
          for i in 1 2 3 4; do
            git fetch -q --depth 1 origin "$COMAPS_COMMIT" && break
            [ "$i" = 4 ] && { echo "::error::Codeberg non raggiungibile"; exit 1; }
            echo "::warning::Codeberg non risponde, riprovo ($i)"
            if [ "$i" = 2 ] && command -v resolvectl >/dev/null; then
              iface=$(ip route show default | awk '{print $5; exit}')
              sudo resolvectl dns "$iface" 9.9.9.9 1.1.1.1 || true
              sudo resolvectl flush-caches || true
            fi
            sleep 30
          done
          git checkout -q FETCH_HEAD
          git submodule update --depth 1 --init --recursive --jobs=$(( $(nproc) * 8 ))
          echo "sorgenti $(du -sh "$HOME/comaps" | cut -f1)" | tee -a "$RUNNER_TEMP/misure.txt"
          echo "scarico $(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/tempi.txt"

      - name: Adatta a Eurise
        run: python3 maps/eurise_patch.py "$HOME/comaps" app/debug-key/eurise-debug.keystore

      - name: Controlla la variante (un solo permesso della suite, destinatari della stessa variante)
        run: python3 maps/test/controlla_variante.py "$HOME/comaps" "$EURISE_VARIANTE"

      - name: Riprende la ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: maps-ccache-${{ env.COMAPS_COMMIT }}-${{ github.run_id }}
          restore-keys: maps-ccache-

      - name: Configura (stili, simboli, testi, mappe del mondo)
        run: |
          t0=$(date +%s)
          cd "$HOME/comaps" && ./configure.sh
          echo "configura $(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/tempi.txt"

      - name: Alleggerisce (simboli, caratteri rari, nomi dei paesi)
        run: |
          set -o pipefail
          python3 maps/eurise_slim.py "$HOME/comaps" | tee -a "$RUNNER_TEMP/misure.txt"

      - name: Compila (FdroidRelease, arm64, firmata con la chiave di debug della suite)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          t0=$(date +%s)
          cd "$HOME/comaps/android"
          if ! ./gradlew --no-daemon -Parm64 assembleFdroidRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            grep -E "error:|FAILED|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" | head -60
            tail -40 "$RUNNER_TEMP/gradle.log"
            exit 1
          fi
          grep -E "BUILD" "$RUNNER_TEMP/gradle.log" || true
          echo "compila $(( $(date +%s) - t0 ))" >> "$RUNNER_TEMP/tempi.txt"
          ccache -s | head -20

      - name: Salva la ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: maps-ccache-${{ env.COMAPS_COMMIT }}-${{ github.run_id }}

      - name: Misura
        if: always()
        run: |
          apk=$(ls "$HOME"/comaps/android/app/build/outputs/apk/fdroid/release/*.apk 2>/dev/null | head -1 || true)
          mkdir -p out
          {
            echo "## Eurise Mappe (CoMaps ${COMAPS_COMMIT:0:8}, arm64, variante $EURISE_VARIANTE)"
            echo
            echo "| Fase | Minuti |"
            echo "|---|---|"
            while read -r name secs; do echo "| $name | $(( secs / 60 )) |"; done < "$RUNNER_TEMP/tempi.txt"
            echo "| totale | $(( ($(date +%s) - T0) / 60 )) |"
            echo
            if [ -n "$apk" ]; then
              if [ "$EURISE_VARIANTE" = ufficiale ]; then nome=eurise-mappe-ufficiale.apk; else nome=eurise-mappe-debug.apk; fi
              cp "$apk" "out/$nome"
              echo "APK: **$(du -m "$apk" | cut -f1) MB** ($(stat -c %s "$apk") byte)"
              echo
              echo "| Parte dell'APK | MB (compressi) |"
              echo "|---|---|"
              python3 - "$apk" <<'PY'
          import sys, zipfile, collections
          z = zipfile.ZipFile(sys.argv[1])
          parts = collections.Counter()
          for i in z.infolist():
              n = i.filename
              key = ("librerie " + n.split("/")[-1]) if n.startswith("lib/") else \
                    ("assets/" + n.split("/")[1]) if n.startswith("assets/") and n.count("/") > 1 else \
                    ("assets (file)" if n.startswith("assets/") else "codice e risorse")
              parts[key] += i.compress_size
          for k, v in parts.most_common(15):
              print(f"| {k} | {v / 1048576:.1f} |")
          PY
            else
              echo "APK non prodotto: vedi il registro di Gradle nell'artefatto."
            fi
            echo
            cat "$RUNNER_TEMP/misure.txt" 2>/dev/null | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY" > out/misure.md
          cat out/misure.md
          cp "$RUNNER_TEMP/gradle.log" out/ 2>/dev/null || true

      - name: Carica l'APK e le misure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eurise-mappe-${{ env.EURISE_VARIANTE == 'ufficiale' && 'ufficiale' || 'debug' }}-${{ github.run_number }}
          path: out/
