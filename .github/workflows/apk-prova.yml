name: APK di prova in una pre-release

# Copia gli APK di prova di un giro di «Compila» nella pre-release «apk-prova» (sempre la stessa, sovrascritta), così si
# scaricano con un link diretto anche da dove gli artefatti di Actions non arrivano. Parte a mano con il numero del giro.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id del giro di Compila (vuoto = ultimo riuscito sul ramo brand)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Trova il giro
        id: giro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=brand&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          num=$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.run_number')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.giro.outputs.id }}
          github-token: ${{ github.token }}
          path: artefatti

      - name: Pubblica nella pre-release apk-prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          find artefatti -name '*.apk' -exec cp {} apk/ \;
          ls -la apk
          gh release delete apk-prova -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-prova apk/*.apk -R "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "APK di prova (giro ${{ steps.giro.outputs.num }})" \
            --notes "APK di prova (firmati con la chiave di prova) del giro ${{ steps.giro.outputs.num }} di Compila. Si sovrascrive a ogni pubblicazione."
