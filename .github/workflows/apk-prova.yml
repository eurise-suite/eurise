name: APK di prova in una pre-release

# Copia gli APK di prova di un giro di «Compila» nella pre-release «apk-prova» (sempre la stessa, sovrascritta), così si
# scaricano con un link diretto anche da dove gli artefatti di Actions non arrivano. Parte a mano con il numero del giro
# (solo dal ramo predefinito) o quando cambia questo file (ultimo giro riuscito sul ramo brand). Aggiunge anche l'ultimo
# APK riuscito di Eurise Mappe (lavoro a parte, «Prototipo di Eurise Mappe»). Ultima pubblicazione: giro 645 (tre temi di icone nuovi nella Scrivania) e Office 57. Dal 16 novembre Office
# leggero arriva da Compila e il motore da office-app (prova-office o brand).
on:
  push:
    paths:
      - ".github/workflows/apk-prova.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id del giro di Compila (vuoto = ultimo riuscito sul ramo brand)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Trova il giro
        id: giro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=brand&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          num=$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq '.run_number')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          mappe=$(gh api "repos/${{ github.repository }}/actions/workflows/maps-engine.yml/runs?branch=brand&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          echo "mappe=$mappe" >> "$GITHUB_OUTPUT"
          # Motore di Office (APK compagno): l'ultimo giro riuscito di office-app su prova-office o brand.
          office=$(gh api "repos/${{ github.repository }}/actions/workflows/office-app.yml/runs?status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.head_branch == "prova-office" or .head_branch == "brand")][0].id // empty')
          echo "office=$office" >> "$GITHUB_OUTPUT"
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.giro.outputs.id }}
          github-token: ${{ github.token }}
          path: artefatti

      - uses: actions/download-artifact@v4
        if: steps.giro.outputs.mappe != ''
        with:
          run-id: ${{ steps.giro.outputs.mappe }}
          github-token: ${{ github.token }}
          path: artefatti/mappe

      # «Eurise Office Motore» (lavoro a parte, molto lungo): l'ultimo riuscito, fuori da artefatti/. Office (leggero)
      # arriva invece dal giro di Compila, con gli altri APK.
      - uses: actions/download-artifact@v4
        if: steps.giro.outputs.office != ''
        with:
          run-id: ${{ steps.giro.outputs.office }}
          github-token: ${{ github.token }}
          path: office

      - name: Pubblica nella pre-release apk-prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          find artefatti -name '*.apk' -exec cp {} apk/ \;
          motore=$(find office -name 'eurise-office-motore-debug.apk' 2>/dev/null | head -1)
          if [ -n "$motore" ]; then cp "$motore" apk/; fi
          # Il Ponte per il computer (Linux): la cartella del programma in un archivio (serve Java 17).
          ponte=$(find artefatti -maxdepth 1 -type d -name 'eurise-ponte-linux-*' | head -1)
          if [ -n "$ponte" ]; then tar -czf apk/eurise-ponte-linux.tar.gz -C "$ponte" .; fi
          # Eurise per Firefox (computer): l'estensione da caricare in Firefox, accanto al Ponte.
          find artefatti -name 'eurise-firefox.xpi' -exec cp {} apk/ \;
          # Eurise per il computer: il programma per Linux (con Java dentro) e il Flatpak.
          find artefatti -name 'eurise-linux.tar.gz' -exec cp {} apk/ \;
          find artefatti -name 'eurise-linux.flatpak' -exec cp {} apk/ \;
          ls -la apk
          gh release delete apk-prova -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-prova apk/* -R "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "APK di prova (giro ${{ steps.giro.outputs.num }})" \
            --notes "APK di prova (firmati con la chiave di prova) del giro ${{ steps.giro.outputs.num }} di Compila. Si sovrascrive a ogni pubblicazione."
          # A volte la release resta in bozza (16 novembre: i link davano 404): la si rende pubblica e si controlla.
          gh release edit apk-prova -R "${{ github.repository }}" --draft=false --prerelease
          sleep 5
          test "$(gh release view apk-prova -R "${{ github.repository }}" --json isDraft --jq .isDraft)" = "false"
