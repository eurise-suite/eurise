name: Prova della rotazione della chiave di prova

# Temporaneo (18 novembre 2026): prima di usare la chiave nuova sul telefono del proprietario (password vere), si prova su
# un emulatore che la firma con rotazione (.github/scripts/firma-prova.sh, qui con una chiave usa e getta):
# 1. aggiorni le app installate con la vecchia chiave senza disinstallarle e senza perdere i dati;
# 2. tolga i permessi di firma a un'app firmata solo con la vecchia chiave (l'«intrusa»);
# 3. li lasci alle app con la chiave nuova.
on:
  push:
    branches: [sicurezza]
    paths:
      - ".github/workflows/prova-firma.yml"
      - ".github/scripts/firma-prova.sh"
      - ".github/scripts/prova-firma-emulatore.sh"

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: APK di prova attuali (vecchia chiave) e copie firmate con la chiave nuova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir vecchi fase1 fase2
          gh release download apk-prova -R "${{ github.repository }}" -D vecchi -p password-debug.apk -p app-debug.apk -p phone-debug.apk
          cp vecchi/password-debug.apk vecchi/app-debug.apk fase1/
          cp vecchi/password-debug.apk vecchi/app-debug.apk fase2/
          keytool -genkeypair -keystore usa-e-getta.p12 -storetype PKCS12 -storepass eurise-prova -keypass eurise-prova \
            -alias eurise-prova -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -validity 365 -dname "CN=Prova" 2>/dev/null
          k="$(base64 -w0 usa-e-getta.p12)"
          EURISE_PROVA_KEYSTORE="$k" EURISE_PROVA_FASE=1 .github/scripts/firma-prova.sh fase1/*.apk
          EURISE_PROVA_KEYSTORE="$k" EURISE_PROVA_FASE=2 .github/scripts/firma-prova.sh fase2/*.apk
          # L'intrusa «pura»: un APK senza codice che chiede soltanto il permesso della suite, firmato con la vecchia
          # chiave pubblica (come farebbe chiunque abbia letto il repository).
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          mkdir intrusa
          cat > intrusa/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.esempio.intrusa">
              <uses-permission android:name="eu.eurise.permission.SUITE_DEBUG" />
              <application android:hasCode="false" android:label="Intrusa" />
          </manifest>
          XML
          "$bt/aapt2" link -o intrusa/grezza.apk --manifest intrusa/AndroidManifest.xml -I "$jar" --min-sdk-version 26 --target-sdk-version 34
          "$bt/zipalign" -f 4 intrusa/grezza.apk vecchi/intrusa.apk
          "$bt/apksigner" sign --ks app/debug-key/eurise-debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android vecchi/intrusa.apk
          "$bt/apksigner" verify --print-certs vecchi/intrusa.apk | head -2

      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e prova
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/prova-firma-emulatore.sh
