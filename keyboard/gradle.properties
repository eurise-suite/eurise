android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1024m

# Impronte delle librerie (docs/SICUREZZA.md, punto 4): spente finché non coprono i plugin scaricati da tutti gli archivi
# (con la cache vuota, anche in «lenient», un plugin con impronta diversa ferma la compilazione). Poi «strict».
org.gradle.dependency.verification=off
